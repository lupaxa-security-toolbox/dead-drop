[recipe]
name = "private-archive"
operation = "distribute"

[input]
path = "archive.zip"
compress = "auto"

[security]
encrypt = true
algorithm = "chacha20-poly1305"
key_source = "prompt"

[carriers]
directory = "./photographs"
recursive = true
formats = ["png", "bmp"]

[distribution]
strategy = "erasure-coded"
data_shards = 2
parity_shards = 1

[output]
directory = "./concealed"
verify = true
